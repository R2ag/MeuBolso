<section class="page-container">
  <div class="page-header">
    <div>
      <p class="eyebrow">Visualização Financeira</p>
      <h1>Lançamentos</h1>
      <p class="subtitle">Acompanhe seu saldo e o histórico de transações.</p>
    </div>
    <div class="actions">
      <button pButton type="button" label="Novo Lançamento" class="p-button-success"></button>
    </div>
  </div>

  <div class="summary-cards">
    <div class="card">
      <h3>Saldo Atual</h3>
      <p class="amount" [class.positive]="getSaldo() >= 0" [class.negative]="getSaldo() < 0">
        {{ getSaldo() | currency:'BRL' }}
      </p>
    </div>
  </div>

  <div class="table-container">
    <p-table [value]="lancamentos()" [paginator]="true" [rows]="10" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Data</th>
          <th>Descrição</th>
          <th>Categoria</th>
          <th style="text-align: right">Valor</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.data }}</td>
          <td>{{ item.descricao }}</td>
          <td><span class="badge">{{ item.categoria }}</span></td>
          <td style="text-align: right" [class.income]="item.tipo === 'RECEITA'" [class.expense]="item.tipo === 'DESPESA'">
            {{ item.valor | currency:'BRL' }}
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="empty-message">Nenhum lançamento encontrado.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>
