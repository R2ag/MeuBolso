<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>MeuBolso</h1>
      <p>Faça login para acessar suas finanças</p>
    </div>
    
    <div class="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" class="p-inputtext" [(ngModel)]="email">
      </div>
      
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="••••••••" class="p-inputtext" [(ngModel)]="password">
      </div>
      
      <button pButton type="button" label="Entrar" class="login-button" [disabled]="!email || !password" (click)="login()"></button>
    </div>
  </div>
</div>
