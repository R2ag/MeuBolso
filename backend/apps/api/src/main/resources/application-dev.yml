spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meubolso}
    username: ${SPRING_DATASOURCE_USERNAME:meubolso}
    password: ${SPRING_DATASOURCE_PASSWORD:meubolso}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
